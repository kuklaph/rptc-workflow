<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
    }
    body {
      margin: 0 auto;
      max-width: 76rem;
      padding: 2rem;
    }
    main { min-width: 0; }
    nav { border-bottom: 1px solid currentColor; margin-bottom: 2rem; }
    pre, code { font-family: ui-monospace, monospace; }
    pre { overflow-x: auto; padding: 1rem; border: 1px solid currentColor; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid currentColor; padding: .5rem; text-align: left; }
    a:focus-visible, button:focus-visible { outline: 3px solid currentColor; }
    @media (max-width: 40rem) { body { padding: 1rem; } }
    @media print { nav, .screen-only { display: none; } body { max-width: none; } }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <header>
    <h1>{{TITLE}}</h1>
    <p>{{METADATA}}</p>
  </header>
  {{TABLE_OF_CONTENTS}}
  <main>
    {{CONTENT}}
  </main>
</body>
</html>
